<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта ПО / ПА</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .panel {
      position: fixed; z-index: 1000; top: 10px; left: 10px;
      background: white; padding: 10px; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.2); font-family: sans-serif;
    }
    button { padding: 10px 14px; margin: 3px; border: 0; border-radius: 9px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="panel">
    <b>Карта</b><br>
    <button onclick="setType('ПО')">🔵 ПО</button>
    <button onclick="setType('ПА')">🔴 ПА</button>
    <div id="status">Выберите тип метки и нажмите на карту</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([28.1, -15.4], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let selectedType = null;

    function setType(type) {
      selectedType = type;
      document.getElementById('status').textContent =
        'Выбрано: ' + type + '. Теперь нажмите место на карте.';
    }

    map.on('click', async (e) => {
      if (!selectedType) return;

      const marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
      marker.bindPopup(selectedType).openPopup();

      // В следующем шаге подключим сохранение меток для всех участников
      selectedType = null;
      document.getElementById('status').textContent =
        'Метка поставлена. Выберите следующий тип.';
    });
  </script>
</body>
</html>
